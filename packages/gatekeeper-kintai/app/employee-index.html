<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; worker-src 'none'; child-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>Kintai</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: var(--color-kumo-base, #fcfcfb);
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: var(--color-kumo-base, #16141d);
        }
      }
    </style>
    <script>
      document.documentElement.dataset.mode = window.matchMedia("(prefers-color-scheme: dark)")
        .matches
        ? "dark"
        : "light";
      // The same first-byte guess the theme above makes, for the same reason: `lang="en"` in the
      // markup would be a claim about a document that has not decided its language yet, and this
      // page's first render waits on `whoAmI()` for the choice saved against the account.
      // `LanguageProvider` owns the attribute from then on and overwrites this — including when the
      // saved choice disagrees with the browser — so this is only about the frames before React.
      document.documentElement.lang = (navigator.language || "").toLowerCase().startsWith("ja")
        ? "ja"
        : "en";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./employee-main.tsx"></script>
  </body>
</html>
